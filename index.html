<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Hidden Gems</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d12;
    color: #ffffff;
}

body {
    overflow-x: hidden;
}

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11, 13, 18, 0.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid #20242d;
}

.header-inner {
    max-width: 1400px;
    margin: auto;
    padding: 18px 22px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: #00aaff;
}

.subtitle {
    margin-top: 4px;
    color: #8f98a8;
    font-size: 14px;
}

.controls {
    max-width: 1400px;
    margin: auto;
    padding: 18px 22px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.search {
    flex: 1;
    min-width: 230px;
    background: #151922;
    border: 1px solid #282e3a;
    color: white;
    padding: 13px 16px;
    border-radius: 12px;
    outline: none;
    font-size: 15px;
}

.search:focus {
    border-color: #00aaff;
}

.select {
    background: #151922;
    border: 1px solid #282e3a;
    color: white;
    padding: 13px 16px;
    border-radius: 12px;
    outline: none;
}

.stats {
    max-width: 1400px;
    margin: auto;
    padding: 0 22px 18px;
    color: #8f98a8;
    font-size: 14px;
}

#status {
    color: #00aaff;
}

.grid {
    max-width: 1400px;
    margin: auto;
    padding: 0 22px 50px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
}

.card {
    background: #151922;
    border: 1px solid #242a35;
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.18s ease,
                border-color 0.18s ease,
                box-shadow 0.18s ease;
}

.card:hover {
    transform: translateY(-4px);
    border-color: #00aaff;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
}

.image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0f1117;
    overflow: hidden;
}

.game-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.online {
    position: absolute;
    right: 10px;
    top: 10px;
    background: rgba(0, 0, 0, 0.78);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9px;
    padding: 6px 9px;
    font-size: 12px;
    font-weight: 700;
}

.online-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #20e070;
    margin-right: 5px;
}

.card-body {
    padding: 14px;
}

.game-name {
    font-size: 17px;
    font-weight: 800;
    line-height: 1.25;
    margin-bottom: 7px;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.description {
    color: #8f98a8;
    font-size: 13px;
    line-height: 1.45;
    min-height: 38px;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.info {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 12px;
    color: #aeb6c5;
    font-size: 12px;
}

.play {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 11px;
    text-align: center;
    text-decoration: none;
    background: #00aaff;
    color: white;
    font-weight: 800;
    border-radius: 10px;
    transition: background 0.15s ease;
}

.play:hover {
    background: #008ed1;
}

.loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: #8f98a8;
}

.spinner {
    width: 42px;
    height: 42px;
    margin: 0 auto 18px;
    border: 4px solid #252b36;
    border-top-color: #00aaff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.error {
    grid-column: 1 / -1;
    text-align: center;
    padding: 70px 20px;
    color: #ff6874;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 70px 20px;
    color: #8f98a8;
}

.footer {
    border-top: 1px solid #20242d;
    padding: 25px;
    text-align: center;
    color: #697384;
    font-size: 13px;
}

@media (max-width: 600px) {
    .logo {
        font-size: 23px;
    }

    .header-inner {
        padding: 15px;
    }

    .controls {
        padding: 14px 15px;
    }

    .stats {
        padding: 0 15px 15px;
    }

    .grid {
        padding: 0 15px 35px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .card {
        border-radius: 12px;
    }

    .card-body {
        padding: 10px;
    }

    .game-name {
        font-size: 14px;
    }

    .description {
        font-size: 11px;
    }

    .info {
        font-size: 10px;
        gap: 7px;
    }

    .play {
        font-size: 12px;
        padding: 9px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">
            Roblox <span>Hidden Gems</span>
        </div>

        <div class="subtitle">
            Находи интересные игры Roblox, а не только топ-популярные
        </div>
    </div>
</header>

<div class="controls">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Поиск игры..."
        autocomplete="off"
    >

    <select id="sort" class="select">
        <option value="online">🔥 Онлайн</option>
        <option value="new">🆕 Новые</option>
        <option value="visits">👀 Посещения</option>
        <option value="favorites">⭐ Избранное</option>
        <option value="name">🔤 Название</option>
        <option value="random">🎲 Случайные</option>
    </select>

</div>

<div class="stats">
    Найдено игр:
    <b id="count">0</b>
    ·
    <span id="status">Загрузка каталога...</span>
</div>

<main id="grid" class="grid">

    <div class="loading">
        <div class="spinner"></div>
        <div>Загрузка игр...</div>
    </div>

</main>

<footer class="footer">
    Roblox Hidden Gems · Каталог обновляется автоматически
</footer>

<script>

const DATA_URL = "./games.json";

let allGames = [];
let filteredGames = [];

const grid = document.getElementById("grid");
const searchInput = document.getElementById("search");
const sortSelect = document.getElementById("sort");
const countElement = document.getElementById("count");
const statusElement = document.getElementById("status");


function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatNumber(number) {

    number = Number(number) || 0;

    if (number >= 1000000000) {
        return (
            (number / 1000000000)
            .toFixed(1)
            .replace(".0", "")
            + "B"
        );
    }

    if (number >= 1000000) {
        return (
            (number / 1000000)
            .toFixed(1)
            .replace(".0", "")
            + "M"
        );
    }

    if (number >= 1000) {
        return (
            (number / 1000)
            .toFixed(1)
            .replace(".0", "")
            + "K"
        );
    }

    return number.toLocaleString("ru-RU");
}


function getThumbnail(game) {

    if (
        game.thumbnail &&
        typeof game.thumbnail === "string"
    ) {
        return game.thumbnail;
    }

    if (game.universeId) {

        return (
            "https://thumbnails.roblox.com/v1/games/icons" +
            "?universeIds=" +
            encodeURIComponent(game.universeId) +
            "&returnPolicy=PlaceHolder" +
            "&size=512x512" +
            "&format=Png" +
            "&isCircular=false"
        );
    }

    return "";
}


function getGameURL(game) {

    if (game.url) {
        return game.url;
    }

    if (game.placeId) {

        return (
            "https://www.roblox.com/games/" +
            game.placeId
        );
    }

    if (game.universeId) {

        return (
            "https://www.roblox.com/games/" +
            game.universeId
        );
    }

    return "#";
}


function getDate(game) {

    if (!game.created) {
        return 0;
    }

    const date = new Date(
        game.created
    );

    return date.getTime() || 0;
}


function sortGames(games) {

    const mode = sortSelect.value;

    const result = [...games];

    if (mode === "online") {

        result.sort(
            (a, b) =>
                (Number(b.playing) || 0) -
                (Number(a.playing) || 0)
        );

    } else if (mode === "visits") {

        result.sort(
            (a, b) =>
                (Number(b.visits) || 0) -
                (Number(a.visits) || 0)
        );

    } else if (mode === "favorites") {

        result.sort(
            (a, b) =>
                (Number(b.favorites) || 0) -
                (Number(a.favorites) || 0)
        );

    } else if (mode === "new") {

        result.sort(
            (a, b) =>
                getDate(b) -
                getDate(a)
        );

    } else if (mode === "name") {

        result.sort(
            (a, b) =>
                String(a.name || "")
                    .localeCompare(
                        String(b.name || ""),
                        "ru"
                    )
        );

    } else if (mode === "random") {

        result.sort(
            () => Math.random() - 0.5
        );
    }

    return result;
}


function createCard(game) {

    const name =
        escapeHTML(
            game.name || "Без названия"
        );

    const description =
        escapeHTML(
            game.description ||
            "Описание отсутствует."
        );

    const playing =
        Number(game.playing) || 0;

    const visits =
        Number(game.visits) || 0;

    const favorites =
        Number(game.favorites) || 0;

    const thumbnail =
        escapeHTML(
            getThumbnail(game)
        );

    const url =
        escapeHTML(
            getGameURL(game)
        );

    return `
        <article class="card">

            <div class="image-wrap">

                <img
                    class="game-image"
                    src="${thumbnail}"
                    alt="${name}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x338/151922/ffffff?text=Roblox';"
                >

                <div class="online">
                    <span class="online-dot"></span>
                    ${formatNumber(playing)}
                </div>

            </div>

            <div class="card-body">

                <div class="game-name">
                    ${name}
                </div>

                <div class="description">
                    ${description}
                </div>

                <div class="info">

                    <span>
                        👥 ${formatNumber(playing)}
                    </span>

                    <span>
                        👀 ${formatNumber(visits)}
                    </span>

                    <span>
                        ⭐ ${formatNumber(favorites)}
                    </span>

                </div>

                <a
                    class="play"
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Играть в Roblox
                </a>

            </div>

        </article>
    `;
}


function render() {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();

    if (!query) {

        filteredGames = [...allGames];

    } else {

        filteredGames =
            allGames.filter(
                game => {

                    const name =
                        String(
                            game.name || ""
                        ).toLowerCase();

                    const description =
                        String(
                            game.description || ""
                        ).toLowerCase();

                    return (
                        name.includes(query) ||
                        description.includes(query)
                    );
                }
            );
    }

    filteredGames =
        sortGames(filteredGames);

    countElement.textContent =
        filteredGames.length.toLocaleString(
            "ru-RU"
        );

    if (filteredGames.length === 0) {

        grid.innerHTML = `
            <div class="empty">
                😔 Игр не найдено
            </div>
        `;

        return;
    }

    grid.innerHTML =
        filteredGames
            .map(createCard)
            .join("");
}


async function loadGames() {

    try {

        statusElement.textContent =
            "Загружаем games.json...";

        /*
         * cache-busting нужен, чтобы браузер
         * не показывал старый games.json.
         */

        const url =
            DATA_URL +
            "?v=" +
            Date.now();

        const response =
            await fetch(
                url,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        /*
         * Поддерживаем оба варианта:
         *
         * { games: [...] }
         *
         * и просто [...]
         */

        if (Array.isArray(data)) {

            allGames = data;

        } else if (
            data &&
            Array.isArray(data.games)
        ) {

            allGames = data.games;

        } else {

            throw new Error(
                "games.json не содержит массив games"
            );
        }

        /*
         * Удаляем дубли по universeId.
         */

        const unique =
            new Map();

        for (const game of allGames) {

            const id =
                game.universeId ||
                game.placeId ||
                game.name;

            if (!unique.has(String(id))) {

                unique.set(
                    String(id),
                    game
                );
            }
        }

        allGames =
            Array.from(
                unique.values()
            );

        statusElement.textContent =
            "Каталог загружен ✓";

        render();

    } catch (error) {

        console.error(
            "Catalog error:",
            error
        );

        statusElement.textContent =
            "Ошибка загрузки";

        grid.innerHTML = `
            <div class="error">

                <h2>
                    Не удалось загрузить каталог 😢
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

                <p>
                    Проверь, что
                    <b>games.json</b>
                    находится рядом с
                    <b>index.html</b>.
                </p>

                <button
                    onclick="location.reload()"
                    style="
                        margin-top:15px;
                        padding:11px 18px;
                        border:0;
                        border-radius:10px;
                        background:#00aaff;
                        color:white;
                        font-weight:800;
                        cursor:pointer;
                    "
                >
                    Повторить
                </button>

            </div>
        `;
    }
}


searchInput.addEventListener(
    "input",
    render
);

sortSelect.addEventListener(
    "change",
    render
);

loadGames();

</script>

</body>
</html>
