<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roblox Games</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0f1117;
            color: white;
        }

        header {
            padding: 20px;
            background: #171a23;
            border-bottom: 1px solid #292e3a;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 28px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: 0;
            cursor: pointer;
            font-size: 15px;
        }

        .genre-button {
            padding: 12px 18px;
            border-radius: 10px;
            background: #5865f2;
            color: white;
            font-weight: bold;
        }

        .genre-button:hover {
            background: #4752c4;
        }

        .genre-menu {
            display: none;
            position: absolute;
            margin-top: 8px;
            width: 210px;
            background: #1c202b;
            border: 1px solid #303644;
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
            z-index: 1000;
        }

        .genre-menu.show {
            display: block;
        }

        .genre-menu button {
            display: block;
            width: 100%;
            padding: 11px 12px;
            border-radius: 7px;
            background: transparent;
            color: white;
            text-align: left;
        }

        .genre-menu button:hover {
            background: #303644;
        }

        .genre-wrapper {
            position: relative;
        }

        .message {
            padding: 40px 20px;
            text-align: center;
            color: #aeb5c5;
        }

        .success {
            color: #55e6a5;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 Roblox Games</h1>

    <div class="controls">

        <div class="genre-wrapper">

            <button
                class="genre-button"
                id="genreButton"
                type="button"
            >
                🎭 Жанр игр ▾
            </button>

            <div
                class="genre-menu"
                id="genreMenu"
            >
                <button type="button" data-genre="all">
                    🎮 Все игры
                </button>

                <button type="button" data-genre="adventure">
                    🗺️ Приключения
                </button>

                <button type="button" data-genre="horror">
                    👻 Хоррор
                </button>

                <button type="button" data-genre="obby">
                    🏃 Обби
                </button>

                <button type="button" data-genre="simulator">
                    ⚙️ Симулятор
                </button>

                <button type="button" data-genre="tycoon">
                    🏢 Тайкун
                </button>

                <button type="button" data-genre="roleplay">
                    🎭 Ролевые
                </button>
            </div>

        </div>

    </div>
</header>

<main>
    <div class="message">
        <p class="success">✅ НОВЫЙ index.html ЗАГРУЖЕН!</p>
        <p>Если ты видишь эту надпись и кнопку «🎭 Жанр игр», значит GitHub Pages действительно использует новый index.html.</p>
        <p>Нажми кнопку выше — должно открыться меню жанров.</p>
    </div>
</main>

<script>
    const genreButton = document.getElementById("genreButton");
    const genreMenu = document.getElementById("genreMenu");

    genreButton.addEventListener("click", function () {
        genreMenu.classList.toggle("show");
    });

    document.querySelectorAll("[data-genre]").forEach(function (button) {

        button.addEventListener("click", function () {

            const genre = this.dataset.genre;

            console.log("Выбран жанр:", genre);

            genreButton.textContent =
                "🎭 " + this.textContent.trim() + " ▾";

            genreMenu.classList.remove("show");
        });

    });

    document.addEventListener("click", function (event) {

        if (!event.target.closest(".genre-wrapper")) {
            genreMenu.classList.remove("show");
        }

    });
</script>

</body>
</html>
