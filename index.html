<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Hidden Gems</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d12;
    color: #ffffff;
}

body {
    overflow-x: hidden;
}

/* HEADER */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11, 13, 18, 0.94);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid #20242d;
}

.header-inner {
    max-width: 1450px;
    margin: auto;
    padding: 18px 22px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: #00aaff;
}

.subtitle {
    margin-top: 5px;
    color: #8f98a8;
    font-size: 14px;
}

/* FILTERS */

.controls {
    max-width: 1450px;
    margin: auto;
    padding: 18px 22px 10px;

    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.search {
    flex: 1;
    min-width: 240px;

    background: #151922;
    border: 1px solid #282e3a;

    color: white;

    padding: 13px 16px;

    border-radius: 12px;

    outline: none;

    font-size: 15px;
}

.search:focus {
    border-color: #00aaff;
}

.number-input {
    width: 170px;

    background: #151922;
    border: 1px solid #282e3a;

    color: white;

    padding: 13px 14px;

    border-radius: 12px;

    outline: none;

    font-size: 14px;
}

.number-input:focus {
    border-color: #00aaff;
}

.select {
    background: #151922;
    border: 1px solid #282e3a;

    color: white;

    padding: 13px 15px;

    border-radius: 12px;

    outline: none;

    font-size: 14px;
}

.reset {
    background: #202631;
    border: 1px solid #303744;

    color: white;

    padding: 13px 16px;

    border-radius: 12px;

    cursor: pointer;

    font-weight: 700;
}

.reset:hover {
    background: #2a313e;
}

/* STATS */

.stats {
    max-width: 1450px;
    margin: auto;

    padding: 8px 22px 18px;

    color: #8f98a8;

    font-size: 14px;
}

#status {
    color: #00aaff;
}

/* GRID */

.grid {
    max-width: 1450px;
    margin: auto;

    padding: 0 22px 50px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(240px, 1fr)
        );

    gap: 18px;
}

/* CARD */

.card {
    background: #151922;

    border: 1px solid #242a35;

    border-radius: 16px;

    overflow: hidden;

    transition:
        transform 0.18s ease,
        border-color 0.18s ease,
        box-shadow 0.18s ease;
}

.card:hover {
    transform: translateY(-4px);

    border-color: #00aaff;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.35);
}

/* IMAGE */

.image-wrap {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #0f1117;

    overflow: hidden;
}

.game-image {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

/* ONLINE BADGE */

.online {
    position: absolute;

    right: 10px;
    top: 10px;

    background: rgba(0, 0, 0, 0.80);

    border: 1px solid rgba(255,255,255,0.12);

    border-radius: 9px;

    padding: 6px 9px;

    font-size: 12px;

    font-weight: 700;
}

.online-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #20e070;

    margin-right: 5px;
}

/* CARD BODY */

.card-body {
    padding: 14px;
}

.game-name {
    font-size: 17px;

    font-weight: 800;

    line-height: 1.25;

    margin-bottom: 7px;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;
}

.description {
    color: #8f98a8;

    font-size: 13px;

    line-height: 1.45;

    min-height: 38px;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;
}

/* INFO */

.info {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;

    margin-top: 12px;

    color: #aeb6c5;

    font-size: 12px;
}

/* PLAY BUTTON */

.play {
    display: block;

    width: 100%;

    margin-top: 14px;

    padding: 11px;

    text-align: center;

    text-decoration: none;

    background: #00aaff;

    color: white;

    font-weight: 800;

    border-radius: 10px;

    transition:
        background 0.15s ease;
}

.play:hover {
    background: #008ed1;
}

/* LOADING */

.loading {
    grid-column: 1 / -1;

    text-align: center;

    padding: 80px 20px;

    color: #8f98a8;
}

.spinner {
    width: 42px;
    height: 42px;

    margin: 0 auto 18px;

    border: 4px solid #252b36;

    border-top-color: #00aaff;

    border-radius: 50%;

    animation:
        spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* ERROR */

.error {
    grid-column: 1 / -1;

    text-align: center;

    padding: 70px 20px;

    color: #ff6874;
}

/* EMPTY */

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 70px 20px;

    color: #8f98a8;
}

.empty-title {
    font-size: 22px;

    color: white;

    margin-bottom: 8px;
}

/* FOOTER */

.footer {
    border-top: 1px solid #20242d;

    padding: 25px;

    text-align: center;

    color: #697384;

    font-size: 13px;
}

/* MOBILE */

@media (max-width: 700px) {

    .logo {
        font-size: 23px;
    }

    .header-inner {
        padding: 15px;
    }

    .controls {
        padding:
            14px 15px 8px;
    }

    .stats {
        padding:
            8px 15px 15px;
    }

    .grid {
        padding:
            0 15px 35px;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 10px;
    }

    .search {
        width: 100%;
        min-width: 100%;
    }

    .number-input {
        flex: 1;
        min-width: 0;
        width: 0;
    }

    .select {
        flex: 1;
        min-width: 0;
    }

    .reset {
        width: 100%;
    }

    .card {
        border-radius: 12px;
    }

    .card-body {
        padding: 10px;
    }

    .game-name {
        font-size: 14px;
    }

    .description {
        font-size: 11px;
    }

    .info {
        font-size: 10px;
        gap: 6px;
    }

    .play {
        font-size: 12px;
        padding: 9px;
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="header-inner">

        <div class="logo">
            Roblox <span>Hidden Gems</span>
        </div>

        <div class="subtitle">
            Находи интересные игры Roblox, а не только самые популярные
        </div>

    </div>

</header>


<!-- FILTERS -->

<div class="controls">

    <input
        id="search"
        class="search"
        type="text"
        placeholder="🔎 Поиск игры..."
        autocomplete="off"
    >

    <input
        id="minOnline"
        class="number-input"
        type="number"
        min="0"
        placeholder="Мин. онлайн"
    >

    <input
        id="maxOnline"
        class="number-input"
        type="number"
        min="0"
        placeholder="Макс. онлайн"
    >

    <select
        id="sort"
        class="select"
    >

        <option value="online">
            🔥 По онлайну
        </option>

        <option value="new">
            🆕 Новые
        </option>

        <option value="visits">
            👀 Посещения
        </option>

        <option value="favorites">
            ⭐ Избранное
        </option>

        <option value="name">
            🔤 Название
        </option>

        <option value="random">
            🎲 Случайные
        </option>

    </select>

    <button
        id="reset"
        class="reset"
        type="button"
    >
        Сбросить
    </button>

</div>


<!-- STATS -->

<div class="stats">

    Показано игр:
    <b id="count">0</b>

    ·

    Всего:
    <b id="total">0</b>

    ·

    <span id="status">
        Загрузка каталога...
    </span>

</div>


<!-- GAMES -->

<main
    id="grid"
    class="grid"
>

    <div class="loading">

        <div class="spinner"></div>

        <div>
            Загрузка игр...
        </div>

    </div>

</main>


<footer class="footer">

    Roblox Hidden Gems · Каталог обновляется автоматически

</footer>


<script>

/* =========================================
   CONFIG
========================================= */

const DATA_URL = "./games.json";


/* =========================================
   VARIABLES
========================================= */

let allGames = [];

let filteredGames = [];


/* =========================================
   ELEMENTS
========================================= */

const grid =
    document.getElementById("grid");

const searchInput =
    document.getElementById("search");

const minOnlineInput =
    document.getElementById("minOnline");

const maxOnlineInput =
    document.getElementById("maxOnline");

const sortSelect =
    document.getElementById("sort");

const resetButton =
    document.getElementById("reset");

const countElement =
    document.getElementById("count");

const totalElement =
    document.getElementById("total");

const statusElement =
    document.getElementById("status");


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================
   FORMAT NUMBERS
========================================= */

function formatNumber(number) {

    number =
        Number(number) || 0;

    if (number >= 1000000000) {

        return (
            (number / 1000000000)
                .toFixed(1)
                .replace(
                    ".0",
                    ""
                )
            + "B"
        );
    }

    if (number >= 1000000) {

        return (
            (number / 1000000)
                .toFixed(1)
                .replace(
                    ".0",
                    ""
                )
            + "M"
        );
    }

    if (number >= 1000) {

        return (
            (number / 1000)
                .toFixed(1)
                .replace(
                    ".0",
                    ""
                )
            + "K"
        );
    }

    return number.toLocaleString(
        "ru-RU"
    );
}


/* =========================================
   THUMBNAIL
========================================= */

function getThumbnail(game) {

    /*
       Сначала используем thumbnail,
       который записал collector.py.
    */

    if (
        game.thumbnail &&
        typeof game.thumbnail === "string"
    ) {

        return game.thumbnail;
    }


    /*
       Запасной вариант:
       Roblox thumbnail API.
    */

    if (game.universeId) {

        return (
            "https://thumbnails.roblox.com/v1/games/icons" +
            "?universeIds=" +
            encodeURIComponent(
                game.universeId
            ) +
            "&returnPolicy=PlaceHolder" +
            "&size=512x512" +
            "&format=Png" +
            "&isCircular=false"
        );
    }


    return "";
}


/* =========================================
   GAME URL
========================================= */

function getGameURL(game) {

    if (game.url) {

        return game.url;
    }

    if (game.placeId) {

        return (
            "https://www.roblox.com/games/" +
            game.placeId
        );
    }

    if (game.universeId) {

        return (
            "https://www.roblox.com/games/" +
            game.universeId
        );
    }

    return "#";
}


/* =========================================
   DATE
========================================= */

function getDate(game) {

    if (!game.created) {
        return 0;
    }

    const date =
        new Date(
            game.created
        );

    return (
        date.getTime() || 0
    );
}


/* =========================================
   SORT
========================================= */

function sortGames(games) {

    const mode =
        sortSelect.value;

    const result =
        [...games];


    if (mode === "online") {

        result.sort(
            (a, b) =>
                (
                    Number(b.playing) || 0
                ) -
                (
                    Number(a.playing) || 0
                )
        );

    }


    else if (mode === "visits") {

        result.sort(
            (a, b) =>
                (
                    Number(b.visits) || 0
                ) -
                (
                    Number(a.visits) || 0
                )
        );

    }


    else if (mode === "favorites") {

        result.sort(
            (a, b) =>
                (
                    Number(b.favorites) || 0
                ) -
                (
                    Number(a.favorites) || 0
                )
        );

    }


    else if (mode === "new") {

        result.sort(
            (a, b) =>
                getDate(b) -
                getDate(a)
        );

    }


    else if (mode === "name") {

        result.sort(
            (a, b) =>
                String(
                    a.name || ""
                ).localeCompare(
                    String(
                        b.name || ""
                    ),
                    "ru"
                )
        );

    }


    else if (mode === "random") {

        result.sort(
            () =>
                Math.random() - 0.5
        );
    }


    return result;
}


/* =========================================
   CREATE CARD
========================================= */

function createCard(game) {

    const name =
        escapeHTML(
            game.name ||
            "Без названия"
        );

    const description =
        escapeHTML(
            game.description ||
            "Описание отсутствует."
        );

    const playing =
        Number(
            game.playing
        ) || 0;

    const visits =
        Number(
            game.visits
        ) || 0;

    const favorites =
        Number(
            game.favorites
        ) || 0;

    const thumbnail =
        escapeHTML(
            getThumbnail(game)
        );

    const url =
        escapeHTML(
            getGameURL(game)
        );


    return `

        <article class="card">

            <div class="image-wrap">

                <img
                    class="game-image"
                    src="${thumbnail}"
                    alt="${name}"
                    loading="lazy"
                    referrerpolicy="no-referrer"
                    onerror="
                        this.onerror=null;
                        this.src='https://placehold.co/600x338/151922/ffffff?text=Roblox';
                    "
                >

                <div class="online">

                    <span class="online-dot"></span>

                    ${formatNumber(
                        playing
                    )}

                </div>

            </div>


            <div class="card-body">

                <div class="game-name">
                    ${name}
                </div>


                <div class="description">
                    ${description}
                </div>


                <div class="info">

                    <span>
                        👥
                        ${formatNumber(
                            playing
                        )}
                    </span>

                    <span>
                        👀
                        ${formatNumber(
                            visits
                        )}
                    </span>

                    <span>
                        ⭐
                        ${formatNumber(
                            favorites
                        )}
                    </span>

                </div>


                <a
                    class="play"
                    href="${url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Играть в Roblox
                </a>

            </div>

        </article>

    `;
}


/* =========================================
   FILTER
========================================= */

function applyFilters() {

    const query =
        searchInput.value
            .trim()
            .toLowerCase();


    let minOnline =
        parseInt(
            minOnlineInput.value,
            10
        );

    let maxOnline =
        parseInt(
            maxOnlineInput.value,
            10
        );


    /*
       Если поле пустое,
       фильтр не используется.
    */

    if (
        Number.isNaN(
            minOnline
        )
    ) {
        minOnline = 0;
    }


    if (
        Number.isNaN(
            maxOnline
        )
    ) {
        maxOnline = Infinity;
    }


    /*
       Если пользователь случайно
       ввёл максимум меньше минимума,
       меняем их местами.
    */

    if (
        maxOnline !== Infinity &&
        maxOnline < minOnline
    ) {

        const temp =
            minOnline;

        minOnline =
            maxOnline;

        maxOnline =
            temp;
    }


    filteredGames =
        allGames.filter(
            game => {

                const name =
                    String(
                        game.name || ""
                    ).toLowerCase();


                const description =
                    String(
                        game.description || ""
                    ).toLowerCase();


                const online =
                    Number(
                        game.playing
                    ) || 0;


                /*
                   Поиск
                */

                const matchesSearch =
                    !query ||
                    name.includes(
                        query
                    ) ||
                    description.includes(
                        query
                    );


                /*
                   Минимальный онлайн
                */

                const matchesMin =
                    online >= minOnline;


                /*
                   Максимальный онлайн
                */

                const matchesMax =
                    online <= maxOnline;


                return (
                    matchesSearch &&
                    matchesMin &&
                    matchesMax
                );
            }
        );


    filteredGames =
        sortGames(
            filteredGames
        );


    render();
}


/* =========================================
   RENDER
========================================= */

function render() {

    countElement.textContent =
        filteredGames.length.toLocaleString(
            "ru-RU"
        );


    totalElement.textContent =
        allGames.length.toLocaleString(
            "ru-RU"
        );


    if (
        filteredGames.length === 0
    ) {

        grid.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    😔 Ничего не найдено
                </div>

                <div>
                    Попробуй изменить фильтры
                    или уменьшить минимальный онлайн.
                </div>

            </div>

        `;

        return;
    }


    grid.innerHTML =
        filteredGames
            .map(
                createCard
            )
            .join("");
}


/* =========================================
   LOAD GAMES
========================================= */

async function loadGames() {

    try {

        statusElement.textContent =
            "Загружаем каталог...";


        /*
           Добавляем timestamp,
           чтобы браузер не использовал
           старый games.json из кеша.
        */

        const url =
            DATA_URL +
            "?v=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    cache:
                        "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        /*
           Поддерживаем:

           {
               "games": [...]
           }

           и:

           [...]
        */

        if (
            Array.isArray(
                data
            )
        ) {

            allGames =
                data;

        }

        else if (
            data &&
            Array.isArray(
                data.games
            )
        ) {

            allGames =
                data.games;

        }

        else {

            throw new Error(
                "games.json не содержит массив games"
            );
        }


        /*
           Убираем дубли.
        */

        const unique =
            new Map();


        for (
            const game of allGames
        ) {

            const id =
                game.universeId ||
                game.placeId ||
                game.name;


            if (
                !unique.has(
                    String(id)
                )
            ) {

                unique.set(
                    String(id),
                    game
                );
            }
        }


        allGames =
            Array.from(
                unique.values()
            );


        totalElement.textContent =
            allGames.length.toLocaleString(
                "ru-RU"
            );


        statusElement.textContent =
            "Каталог загружен ✓";


        /*
           Первоначальный рендер.
        */

        applyFilters();


    }

    catch (error) {

        console.error(
            "Catalog error:",
            error
        );


        statusElement.textContent =
            "Ошибка загрузки";


        grid.innerHTML = `

            <div class="error">

                <h2>
                    Не удалось загрузить каталог 😢
                </h2>

                <p>
                    ${escapeHTML(
                        error.message
                    )}
                </p>

                <p>
                    Проверь, что
                    <b>games.json</b>
                    находится рядом с
                    <b>index.html</b>.
                </p>


                <button
                    onclick="location.reload()"
                    style="
                        margin-top:15px;
                        padding:11px 18px;
                        border:0;
                        border-radius:10px;
                        background:#00aaff;
                        color:white;
                        font-weight:800;
                        cursor:pointer;
                    "
                >
                    Повторить
                </button>

            </div>

        `;
    }
}


/* =========================================
   EVENTS
========================================= */

searchInput.addEventListener(
    "input",
    applyFilters
);


minOnlineInput.addEventListener(
    "input",
    applyFilters
);


maxOnlineInput.addEventListener(
    "input",
    applyFilters
);


sortSelect.addEventListener(
    "change",
    applyFilters
);


resetButton.addEventListener(
    "click",
    () => {

        searchInput.value = "";

        minOnlineInput.value = "";

        maxOnlineInput.value = "";

        sortSelect.value =
            "online";

        applyFilters();
    }
);


/* =========================================
   START
========================================= */

loadGames();

</script>

</body>
    </html>
