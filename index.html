<div class="genre-wrapper">
    <button class="genre-btn" onclick="toggleGenres()">
        🎭 Жанр игр ▾
    </button>

    <div id="genre-menu" class="genre-menu">
        <button onclick="chooseGenre('all')">🎮 Все игры</button>
        <button onclick="chooseGenre('horror')">👻 Хоррор</button>
        <button onclick="chooseGenre('obby')">🏃 Обби</button>
        <button onclick="chooseGenre('simulator')">⚙️ Симулятор</button>
        <button onclick="chooseGenre('tycoon')">🏢 Тайкун</button>
        <button onclick="chooseGenre('roleplay')">🎭 Ролевые</button>
    </div>
</div>

<style>
.genre-wrapper {
    position: relative;
    display: inline-block;
}

.genre-btn {
    padding: 10px 16px;
    border: 0;
    border-radius: 10px;
    background: #5865f2;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.genre-menu {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 180px;
    padding: 6px;
    background: #1b1e27;
    border-radius: 10px;
    z-index: 9999;
}

.genre-menu.open {
    display: block;
}

.genre-menu button {
    display: block;
    width: 100%;
    padding: 9px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: white;
    text-align: left;
    cursor: pointer;
}

.genre-menu button:hover {
    background: #303542;
}
</style>

<script>
function toggleGenres() {
    document.getElementById("genre-menu").classList.toggle("open");
}

function chooseGenre(genre) {
    console.log("Выбран жанр:", genre);

    // Если в твоём сайте уже есть genreFilter:
    const filter = document.getElementById("genreFilter");

    if (filter) {
        filter.value = genre;
        filter.dispatchEvent(new Event("change", { bubbles: true }));
    }

    document.getElementById("genre-menu").classList.remove("open");
}
</script>
