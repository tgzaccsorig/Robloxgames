<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roblox Hidden Gems</title>
<style>
:root{--bg:#08090d;--panel:#11131a;--panel2:#171a23;--line:#272b38;--text:#f6f7fb;--muted:#969baa;--accent:#7c5cff;--green:#35d07f;--radius:18px}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 10% 0%,#7c5cff22,transparent 32%),radial-gradient(circle at 90% 10%,#35d07f12,transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
a{text-decoration:none;color:inherit}
button,input,select{font:inherit}
button,select{cursor:pointer}
.wrap{width:min(1400px,calc(100% - 28px));margin:auto}

header{position:sticky;top:0;z-index:10;background:#08090dcc;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff0b}
.nav{min-height:72px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(135deg,#7c5cff,#4c38b9);font-size:21px}
.brand b{font-size:17px}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.topsearch{position:relative;flex:1;max-width:650px;margin-left:auto}
.topsearch input{width:100%;padding:13px 15px 13px 42px;border:1px solid var(--line);border-radius:13px;background:#ffffff08;color:var(--text);outline:0}
.topsearch input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #7c5cff20}
.glass{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}

main{padding:30px 0 60px}
.hero{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:25px}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1;letter-spacing:-.055em;margin:0}
.hero h1 span{color:#9b86ff}
.hero p{color:var(--muted);max-width:720px;line-height:1.6;margin:14px 0 0}
.stats{display:flex;gap:9px;flex-wrap:wrap}
.stat{min-width:110px;text-align:center;padding:12px 15px;border:1px solid var(--line);border-radius:13px;background:#ffffff07}
.stat b{display:block;font-size:18px}
.stat small{color:var(--muted);font-size:10px}

.toolbar{display:grid;grid-template-columns:1fr 180px 170px 110px;gap:9px;margin-bottom:20px}
.control{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:12px 13px;outline:0}
.control:focus{border-color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(180deg,#ffffff09,#ffffff04);transition:.18s}
.card:hover{transform:translateY(-4px);border-color:#7c5cff88}
.thumb{position:relative;aspect-ratio:1;background:#0d0f14;overflow:hidden}
.thumb img{width:100%;height:100%;display:block;object-fit:cover}
.online{position:absolute;left:9px;top:9px;padding:6px 8px;border-radius:9px;background:#05070acc;border:1px solid #ffffff10;font-size:11px;font-weight:800}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px #35d07fcc;margin-right:5px}
.body{padding:13px}
.title{font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:40px}
.creator{color:var(--muted);font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0}
.pill{font-size:10px;color:#c8cbd5;background:#ffffff08;padding:6px 7px;border-radius:8px}
.play{display:block;text-align:center;background:linear-gradient(135deg,#7c5cff,#5d43d4);padding:10px;border-radius:10px;font-weight:800;font-size:13px}
.empty,.loading{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.spinner{width:30px;height:30px;border:3px solid #ffffff14;border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.pages{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:27px}
.page{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 12px;border-radius:10px}
.page.active{background:#7c5cff2c;border-color:var(--accent)}
.page:disabled{opacity:.4;cursor:not-allowed}
footer{border-top:1px solid var(--line);color:var(--muted);text-align:center;padding:24px 0 35px;font-size:11px}

@media(max-width:1100px){
.grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:800px){
.nav{flex-wrap:wrap;padding:10px 0}
.topsearch{order:3;flex-basis:100%;max-width:none}
.hero{display:block}
.stats{margin-top:18px}
.toolbar{grid-template-columns:1fr 1fr}
.toolbar .q{grid-column:1/-1}
.grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
.wrap{width:calc(100% - 18px)}
.toolbar{grid-template-columns:1fr}
.toolbar .q{grid-column:auto}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<div class="wrap nav">

<a class="brand" href="#">
<div class="logo">🎮</div>
<div>
<b>Roblox Hidden Gems</b>
<small>Find games worth playing</small>
</div>
</a>

<div class="topsearch">
<span class="glass">⌕</span>
<input id="top" placeholder="Search games..." autocomplete="off">
</div>

</div>
</header>

<main class="wrap">

<section class="hero">

<div>
<h1>Discover <span>better</span> Roblox games.</h1>
<p>
Search the catalog, sort by online and popularity,
and find games beyond the usual front page.
</p>
</div>

<div class="stats">

<div class="stat">
<b id="count">—</b>
<small>games</small>
</div>

<div class="stat">
<b id="online">—</b>
<small>online</small>
</div>

</div>

</section>

<section class="toolbar">

<input
id="q"
class="control q"
placeholder="Search by name, creator or genre..."
>

<select id="sort" class="control">
<option value="playing">Online</option>
<option value="favorites">Favorites</option>
<option value="visits">Visits</option>
<option value="newest">Newest</option>
<option value="updated">Updated</option>
<option value="name">Name A-Z</option>
</select>

<select id="genre" class="control">
<option value="all">All genres</option>
</select>

<button id="random" class="control">
🎲 Random
</button>

</section>

<section id="grid" class="grid">
<div class="loading">
<div class="spinner"></div>
Loading games...
</div>
</section>

<nav id="pages" class="pages"></nav>

</main>

<footer>
Roblox Hidden Gems · Catalog updates automatically
</footer>

<script>

const DATA='games.json';
const SIZE=24;

let games=[];
let shown=[];
let page=1;

const $=id=>document.getElementById(id);

const grid=$('grid');
const pages=$('pages');
const q=$('q');
const top=$('top');
const sort=$('sort');
const genre=$('genre');

const n=x=>
Number.isFinite(Number(x))
?Number(x)
:0;

const fmt=x=>
new Intl.NumberFormat('en',{
notation:'compact',
maximumFractionDigits:1
}).format(n(x));

const esc=x=>
String(x??'')
.replaceAll('&','&amp;')
.replaceAll('<','&lt;')
.replaceAll('>','&gt;')
.replaceAll('"','&quot;')
.replaceAll("'",'&#039;');

const thumb=g=>
g.thumbnail||
`https://thumbnails.roblox.com/v1/games/icons?universeIds=${encodeURIComponent(g.universeId)}&returnPolicy=PlaceHolder&size=512x512&format=Png&isCircular=false`;

const creator=g=>
g.creator?.name||'Unknown creator';

function apply(){

const text=q.value.trim().toLowerCase();
const g=genre.value;

shown=games.filter(x=>
(!text||
[
x.name,
x.description,
x.genre,
creator(x)
]
.join(' ')
.toLowerCase()
.includes(text))
&&
(g==='all'||String(x.genre||'All')===g)
);

shown.sort((a,b)=>

sort.value==='playing'
?n(b.playing)-n(a.playing)

:sort.value==='favorites'
?n(b.favorites)-n(a.favorites)

:sort.value==='visits'
?n(b.visits)-n(a.visits)

:sort.value==='newest'
?Date.parse(b.created||'')-Date.parse(a.created||'')

:sort.value==='updated'
?Date.parse(b.updated||'')-Date.parse(a.updated||'')

:String(a.name||'')
.localeCompare(String(b.name||''))

);

page=1;
render();

}

function card(g){

const name=
esc(g.name||'Unknown game');

const url=
esc(
g.url||
`https://www.roblox.com/games/${g.placeId||g.universeId}`
);

return `

<article class="card">

<a
href="${url}"
target="_blank"
rel="noopener"
>

<div class="thumb">

<img
src="${esc(thumb(g))}"
alt="${name}"
loading="lazy"
referrerpolicy="no-referrer"
onerror="this.style.display='none'"
>

<div class="online">
<i class="dot"></i>
${fmt(g.playing)}
</div>

</div>

</a>

<div class="body">

<div class="title">
${name}
</div>

<div class="creator">
by ${esc(creator(g))}
</div>

<div class="meta">

<span class="pill">
👥 ${fmt(g.playing)}
</span>

<span class="pill">
⭐ ${fmt(g.favorites)}
</span>

<span class="pill">
👀 ${fmt(g.visits)}
</span>

<span class="pill">
🏷️ ${esc(g.genre||'All')}
</span>

</div>

<a
class="play"
href="${url}"
target="_blank"
rel="noopener"
>
▶ Play on Roblox
</a>

</div>

</article>

`;

}

function render(){

const total=
Math.max(
1,
Math.ceil(shown.length/SIZE)
);

page=Math.min(page,total);

const part=
shown.slice(
(page-1)*SIZE,
page*SIZE
);

grid.innerHTML=

part.length
?
part.map(card).join('')
:
`
<div class="empty">
🔎
<h2>No games found</h2>
<p>Try another search or genre.</p>
</div>
`;

if(total===1){
pages.innerHTML='';
return;
}

let out=
`
<button
class="page"
${page===1?'disabled':''}
data-p="${page-1}"
>
←
</button>
`;

let a=
Math.max(
1,
page-3
);

let b=
Math.min(
total,
a+6
);

if(b-a<6)
a=Math.max(
1,
b-6
);

for(
let i=a;
i<=b;
i++
){

out+=`
<button
class="page ${i===page?'active':''}"
data-p="${i}"
>
${i}
</button>
`;

}

out+=`
<button
class="page"
${page===total?'disabled':''}
data-p="${page+1}"
>
→
</button>
`;

pages.innerHTML=out;

pages
.querySelectorAll('[data-p]')
.forEach(x=>

x.onclick=()=>{

page=
Number(
x.dataset.p
);

render();

scrollTo({
top:0,
behavior:'smooth'
});

}

);

}

function sync(v){

q.value=v;
top.value=v;

apply();

}

q.oninput=
()=>sync(q.value);

top.oninput=
()=>sync(top.value);

sort.onchange=apply;
genre.onchange=apply;

$('random').onclick=()=>{

if(games.length){

const g=
games[
Math.floor(
Math.random()*games.length
)
];

if(g.url)
open(
g.url,
'_blank',
'noopener'
);

}

};

fetch(
DATA+'?v='+Date.now(),
{
cache:'no-store'
}
)

.then(r=>{

if(!r.ok)
throw Error(
'games.json not found'
);

return r.json();

})

.then(d=>{

games=
Array.isArray(d.games)
?d.games
:[];

$('count').textContent=
fmt(games.length);

$('online').textContent=
fmt(
games.reduce(
(s,g)=>
s+n(g.playing),
0
)
);

const set=
new Set(
games.map(
g=>String(
g.genre||'All'
)
)
);

[
...set
]
.sort()
.forEach(x=>{

const o=
document.createElement(
'option'
);

o.value=x;
o.textContent=x;

genre.appendChild(o);

});

apply();

})

.catch(e=>{

console.error(e);

grid.innerHTML=`

<div class="empty">

⚠️

<h2>
Could not load games.json
</h2>

<p>
Put index.html and games.json
in the same GitHub Pages folder.
</p>

</div>

`;

});

</script>

</body>
</html>
