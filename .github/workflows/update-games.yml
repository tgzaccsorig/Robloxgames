```yaml
name: Update Roblox Catalog

on:

  # Обновлять автоматически каждые 6 часов
  schedule:
    - cron: "17 */6 * * *"

  # Можно запускать руками
  workflow_dispatch:

  # Первый запуск после изменения collector.py
  push:
    paths:
      - "collector.py"
      - ".github/workflows/update-games.yml"


permissions:
  contents: write


jobs:

  update:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      - name: Collect Roblox games
        run: |
          python collector.py


      - name: Check generated catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("games.json")

          if not path.exists():
              raise SystemExit("games.json was not created")

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          games = data.get("games", [])

          if not isinstance(games, list):
              raise SystemExit(
                  "games.json has invalid games field"
              )

          ids = [
              game.get("universeId")
              for game in games
          ]

          unique_ids = set(ids)

          print(
              "Games:",
              len(games)
          )

          print(
              "Unique universe IDs:",
              len(unique_ids)
          )

          if len(games) != len(unique_ids):
              raise SystemExit(
                  "Duplicate universe IDs detected"
              )
          PY


      - name: Commit updated catalog
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --cached --quiet; then

            echo "No catalog changes."

          else

            git commit \
              -m "Update Roblox game catalog"

            git push

          fi
```
