name: Update Roblox Catalog

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Collect Roblox games
        run: |
          python collector.py

      - name: Save online history
        run: |
          python history.py

      - name: Check catalog changes
        run: |
          git status --short

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json history/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Roblox catalog and online history"
          fi

      - name: Sync with main before push
        run: |
          git pull --rebase origin main

      - name: Push catalog
        run: |
          git push origin HEAD:main
