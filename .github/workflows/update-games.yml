name: Update Roblox Catalog

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "collector.py"
      - ".github/workflows/update-games.yml"

permissions:
  contents: write

concurrency:
  group: roblox-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Collect Roblox games
        run: |
          python collector.py

      - name: Check catalog changes
        id: changes
        run: |
          git status --short

          if git diff --quiet --exit-code; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Catalog has changes."
          fi

      - name: Commit updated catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Update Roblox game catalog"

      - name: Sync with main before push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          for i in 1 2 3 4 5; do
            echo "Push attempt $i..."

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push rejected. Updating from remote..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Push failed after 5 attempts."
          exit 1
