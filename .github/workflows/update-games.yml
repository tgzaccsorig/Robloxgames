name: Update Roblox Catalog

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    paths:
      - "collector.py"
      - ".github/workflows/update-games.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect Roblox games
        run: python collector.py

      - name: Check catalog
        run: |
          python -c "import json; d=json.load(open('games.json', encoding='utf-8')); print('Games:', len(d.get('games', []))); ids=[x.get('universeId') for x in d.get('games', [])]; print('Unique:', len(set(ids))); assert len(ids)==len(set(ids)), 'Duplicate games found'"

      - name: Commit updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || git commit -m "Update Roblox game catalog"
          git push
