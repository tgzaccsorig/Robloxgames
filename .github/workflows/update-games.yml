name: Update Roblox Catalog

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    paths:
      - "collector.py"
      - ".github/workflows/update-games.yml"

permissions:
  contents: write

concurrency:
  group: roblox-catalog-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m ensurepip --upgrade
          python -m pip install --upgrade pip
          python -m pip install --user requests

      - name: Verify Python and requests
        run: |
          which python
          python --version
          python -m pip --version
          python -m pip show requests
          python -c "import sys; print(sys.executable)"
          python -c "import requests; print('REQUESTS OK:', requests.__version__)"

      - name: Collect Roblox games
        run: |
          python -u collector.py

      - name: Check catalog
        run: |
          python - <<'PY'
          import json

          with open("games.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          games = data.get("games", [])

          ids = [
              str(game.get("universeId"))
              for game in games
              if game.get("universeId")
          ]

          print("Games:", len(games))
          print("Unique:", len(set(ids)))

          if not games:
              raise SystemExit("games.json is empty")

          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate universeId detected")

          print("Catalog OK")
          PY

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Update Roblox game catalog"

      - name: Push catalog
        run: |
          for attempt in 1 2 3 4 5
          do
            echo "Push attempt $attempt"

            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed."
              sleep 5
              continue
            fi

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Retrying..."
            sleep 5
          done

          echo "Push failed after 5 attempts."
          exit 1
